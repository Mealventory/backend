name: Backend CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_postgres_tests:
        description: Run the disposable PostgreSQL integration suite
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Reject committed generated dependency directories
        shell: bash
        run: |
          tracked="$(git ls-files '.venv311/**' 'node_modules/**')"
          if [ -n "$tracked" ]; then
            echo "Generated dependency directories must not be committed:"
            echo "$tracked"
            exit 1
          fi

  offline-tests:
    name: Offline tests and API contract
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run offline test suite
        run: python -m pytest tests/

      - name: Verify OpenAPI contract
        run: python -m pytest tests/test_v1_consolidation.py::test_openapi_preserves_v1_contract -v

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --tag mealventory-backend:ci .

  postgres-integration:
    name: Disposable PostgreSQL integration tests
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run_postgres_tests }}
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run PostgreSQL integration suite
        env:
          RUN_POSTGRES_TESTS: "1"
        run: python -m pytest tests/test_*postgres.py -v
